server:
  port: 8080

spring:
  application:
    name:backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/plotgram}
    username: ${SPRING_DATASOURCE_USERNAME:plotgram}
    password: ${SPRING_DATASOURCE_PASSWORD:plotgram}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: true

