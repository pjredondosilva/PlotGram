services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    networks:
      - tfgnet

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - tfgnet

networks:
  tfgnet:
